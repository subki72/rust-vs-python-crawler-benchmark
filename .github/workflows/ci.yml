name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-and-test:
    name: Python Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff flake8

      - name: Run Ruff and Flake8 checks
        run: |
          python -m ruff check benchmark_runner.py src crawler-python tests
          python -m flake8 --max-line-length=120 benchmark_runner.py src crawler-python tests

      - name: Run Pytest with coverage gate
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

  rust-lint-and-test:
    name: Rust Format, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crawler-rust

      - name: Check formatting
        run: cargo fmt --manifest-path crawler-rust/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path crawler-rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path crawler-rust/Cargo.toml

  build-and-security:
    name: Docker Build & Security Scans
    needs: [python-lint-and-test, rust-lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build multi-stage Docker image
        run: docker build -t rust-vs-python-crawler-benchmark:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rust-vs-python-crawler-benchmark:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
